[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trayeqo-eval_leak_overfit_segmenter"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对成本与容量治理专家·评测集泄漏与过拟合相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "trayeqo" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://trayeqo.github.io"
Repository = "https://github.com/trayeqo/eval_leak_overfit_segmenter"
Issues = "https://github.com/trayeqo/eval_leak_overfit_segmenter/issues"

[project.scripts]
eval_leak_overfit_segmenter = "eval_leak_overfit_segmenter:main"

[tool.setuptools]
py-modules = ["eval_leak_overfit_segmenter"]
